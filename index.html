<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Pie Chart</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<h2>📊 Staff Dashboard (Pie Chart + Table)</h2>

<div class="container">
  <div>
    <canvas id="pieChart" width="400" height="400"></canvas>
  </div>
</div>

<h3>Table Data</h3>
<table>
  <thead>
    <tr>
      <th>Staff</th>
      <th>Status</th>
      <th>Touch Account</th>
      <th>Branch</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let chart;

async function loadData() {
  const res = await fetch("http://175.136.249.177:3000/report");
  const json = await res.json();

  const data = json.data;

  // ======================
  // TABLE
  // ======================
  let rows = "";

  data.forEach(item => {
    rows += `
      <tr>
        <td>${item.STAFF_NAME}</td>
        <td>${item.STATUS}</td>
        <td>${item.TOUCH_ACCOUNT}</td>
        <td>${item.BRANCH_NAME}</td>
      </tr>
    `;
  });

  document.getElementById("tableBody").innerHTML = rows;

  // ======================
  // PIE CHART (STATUS)
  // ======================
  let statusCount = {};

  data.forEach(item => {
    statusCount[item.STATUS] =
      (statusCount[item.STATUS] || 0) + item.TOUCH_ACCOUNT;
  });

  const labels = Object.keys(statusCount);
  const values = Object.values(statusCount);

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("pieChart"), {
    type: "pie",
    data: {
      labels: labels,
      datasets: [{
        data: values
      }]
    }
  });
}

// auto load
loadData();

</script>

</body>
</html>
